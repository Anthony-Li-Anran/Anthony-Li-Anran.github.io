<!-- start custom footer snippets -->

<!-- Toast notification element -->
<div id="toast" class="toast">
  <span id="toast-message"></span>
</div>

<!-- Support for MatJax -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
  }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<!-- Support for Mermaid -->
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({startOnLoad:true, theme:'default'});
    await mermaid.run({querySelector:'code.language-mermaid'});
</script>

<!-- Language switch functionality -->
<script>
// Language data
const languageData = {
    en: {
        nav: {
            home: "Homepage",
            guide: "Guide",
            cv: "CV",
            learning: "Learning",
            projects: "Projects",
            publications: "Publications",
            blog: "Blog Posts",
            interests: "Interests",
            guestbook: "Guestbook"
        },
        author: {
            name: "Anran Li(Anthony Li)",
            bio: "Undergraduate student in Data Science at Shanghai University of Finance and Economics. Interested in LLM and agent-related research, currently learning relevant theories."
        }
    },
    zh: {
        nav: {
            home: "首页",
            guide: "指南",
            cv: "简历",
            learning: "学习",
            projects: "项目",
            publications: "出版物",
            blog: "博客",
            interests: "兴趣",
            guestbook: "留言板"
        },
        author: {
            name: "李安然（Anthony Li）",
            bio: "上海财经大学数据科学专业本科生。对 LLM 和智能体相关研究感兴趣，目前正在学习相关理论。"
        }
    }
};

// Initialize language
let currentLang = localStorage.getItem('language') || 'en';

document.addEventListener('DOMContentLoaded', function() {
    const langToggle = document.getElementById('lang-toggle');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toast-message');
    
    // Apply initial language
    applyLanguage(currentLang);
    
    // Re-apply language after a delay to ensure Jekyll rendering is complete
    setTimeout(function() {
        applyLanguage(currentLang);
    }, 100);
    
    // Watch for DOM changes and re-apply language when navigation is re-rendered
    const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            if (mutation.addedNodes) {
                mutation.addedNodes.forEach(function(node) {
                    if (node.nodeType === 1) { // Element node
                        const navLinks = node.querySelectorAll('.masthead__menu-item:not(.persist):not(.masthead__menu-item--lg) a');
                        if (navLinks.length > 0) {
                            applyLanguage(currentLang);
                        }
                    }
                });
            }
        });
    });
    
    // Start observing the document body for changes
    observer.observe(document.body, {
        childList: true,
        subtree: true
    });
    
    if (langToggle) {
        langToggle.addEventListener('click', function() {
            // Switch language
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            localStorage.setItem('language', currentLang);
            applyLanguage(currentLang);
            showToast('Language switched to ' + (currentLang === 'en' ? 'English' : '中文'));
        });
    }
    
    function showToast(message) {
        toastMessage.textContent = message;
        toast.classList.add('show');
        
        setTimeout(function() {
            toast.classList.remove('show');
        }, 2000);
    }
    
    function applyLanguage(lang) {
        // Update navigation links
        const navLinks = document.querySelectorAll('.masthead__menu-item:not(.persist):not(.masthead__menu-item--lg) a');
        const navOrder = ['guide', 'cv', 'learning', 'projects', 'publications', 'blog', 'interests', 'guestbook'];
        
        navLinks.forEach((link, index) => {
            if (index < navOrder.length && navOrder[index] in languageData[lang].nav) {
                link.textContent = languageData[lang].nav[navOrder[index]];
            }
        });
        
        // Update language toggle button
        const langToggleSpan = document.querySelector('#lang-toggle span');
        if (langToggleSpan) {
            langToggleSpan.textContent = lang === 'en' ? '中/En' : 'En/中';
        }
        
        // Update author profile
        const authorName = document.querySelector('.author__name');
        const authorBio = document.querySelector('.author__bio');
        if (authorName && languageData[lang].author.name) {
            authorName.textContent = languageData[lang].author.name;
        }
        if (authorBio && languageData[lang].author.bio) {
            authorBio.textContent = languageData[lang].author.bio;
        }
        
        // Update page content with data-lang attributes
        const langElements = document.querySelectorAll('[data-lang-en]');
        langElements.forEach(el => {
            const enText = el.getAttribute('data-lang-en');
            const zhText = el.getAttribute('data-lang-zh');
            el.innerHTML = lang === 'zh' ? zhText : enText;
        });
    }
});
</script>

<!-- end custom footer snippets -->
