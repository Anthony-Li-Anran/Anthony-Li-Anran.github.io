  <span id="toast-message"></span>

<!-- Support for MatJax -->

<!-- Support for Mermaid -->
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({startOnLoad:true, theme:'default'});
    await mermaid.run({querySelector:'code.language-mermaid'});
</script>

<!-- Language switch functionality -->
<script>
// Language data for navigation and author
const languageData = {
    en: {
        nav: {
            guide: "Guide",
            cv: "CV",
            learning: "Learning",
            projects: "Projects",
            publications: "Publications",
            blog: "Blog Posts",
            interests: "Interests",
            guestbook: "Guestbook"
        },
        author: {
            name: "Anran Li(Anthony Li)",
            bio: "Undergraduate student in Data Science at Shanghai University of Finance and Economics. Interested in LLM and agent-related research, currently learning relevant theories."
        }
    },
    zh: {
        nav: {
            guide: "指南",
            cv: "简历",
            learning: "学习",
            projects: "项目",
            publications: "出版物",
            blog: "博客",
            interests: "兴趣",
            guestbook: "留言板"
        },
        author: {
            name: "李安然（Anthony Li）",
            bio: "上海财经大学数据科学专业本科生。对 LLM 和智能体相关研究感兴趣，目前正在学习相关理论。"
        }
    }
};

// Language switch function using page redirection
document.addEventListener('DOMContentLoaded', function() {
    console.log('Language switch script loaded');
    const langToggle = document.getElementById('lang-toggle');
    console.log('lang-toggle element:', langToggle);
    
    // Get saved language preference or default to English
    const savedLang = localStorage.getItem('preferredLanguage') || 'en';
    console.log('Saved language preference:', savedLang);
    
    // Get current URL
    const currentUrl = window.location.pathname;
    const isChinesePage = currentUrl.startsWith('/zh/');
    const isEnglishPage = !isChinesePage;
    console.log('Current URL:', currentUrl);
    console.log('Is Chinese page:', isChinesePage);
    console.log('Is English page:', isEnglishPage);
    
    // Auto-redirect based on saved language preference
    if (savedLang === 'zh' && isEnglishPage) {
        // Redirect to Chinese version
        const chineseUrl = '/zh' + (currentUrl === '/' ? '/' : currentUrl);
        console.log('Auto-redirecting to Chinese URL:', chineseUrl);
        window.location.href = chineseUrl;
        return; // Don't execute the rest of the script
    } else if (savedLang === 'en' && isChinesePage) {
        // Redirect to English version
        const englishUrl = currentUrl.replace('/zh/', '/');
        console.log('Auto-redirecting to English URL:', englishUrl);
        window.location.href = englishUrl;
        return; // Don't execute the rest of the script
    }
    
    // Update navigation links if on Chinese page
    if (isChinesePage) {
        const navLinks = document.querySelectorAll('.masthead__menu-item:not(.persist):not(.masthead__menu-item--lg) a');
        const navOrder = ['guide', 'cv', 'learning', 'projects', 'publications', 'blog', 'interests', 'guestbook'];
        console.log('Nav links found:', navLinks.length);
        console.log('Nav order:', navOrder);
        
        navLinks.forEach((link, index) => {
            if (index < navOrder.length && navOrder[index] in languageData.zh.nav) {
                link.textContent = languageData.zh.nav[navOrder[index]];
                console.log('Updated nav link', index, 'to:', languageData.zh.nav[navOrder[index]]);
            }
        });
        
        // Update author profile
        const authorName = document.querySelector('.author__name');
        const authorBio = document.querySelector('.author__bio');
        console.log('Author name element:', authorName);
        console.log('Author bio element:', authorBio);
        
        if (authorName) {
            authorName.textContent = languageData.zh.author.name;
            console.log('Updated author name to:', languageData.zh.author.name);
        }
        if (authorBio) {
            authorBio.textContent = languageData.zh.author.bio;
            console.log('Updated author bio to:', languageData.zh.author.bio);
        }
    }
    
    if (langToggle) {
        const langToggleLink = langToggle.querySelector('a');
        console.log('lang-toggle link:', langToggleLink);
        if (langToggleLink) {
            langToggleLink.addEventListener('click', function(e) {
                e.preventDefault();
                console.log('Language toggle clicked');
                
                // Get current URL
                const currentUrl = window.location.pathname;
                console.log('Current URL before redirect:', currentUrl);
                
                // Determine new language
                const newLang = isChinesePage ? 'en' : 'zh';
                console.log('New language:', newLang);
                
                // Save language preference
                localStorage.setItem('preferredLanguage', newLang);
                console.log('Saved language preference:', newLang);
                
                // Redirect to new language version
                if (newLang === 'zh') {
                    const chineseUrl = '/zh' + (currentUrl === '/' ? '/' : currentUrl);
                    console.log('Redirecting to Chinese URL:', chineseUrl);
                    window.location.href = chineseUrl;
                } else {
                    const englishUrl = currentUrl.replace('/zh/', '/');
                    console.log('Redirecting to English URL:', englishUrl);
                    window.location.href = englishUrl;
                }
            });
        }
    }
});
</script>

<!-- end custom footer snippets -->
