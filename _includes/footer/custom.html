<!-- start custom footer snippets -->

<!-- Toast notification element -->
<div id="toast" class="toast">
  <span id="toast-message"></span>
</div>

<!-- Support for MatJax -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
  }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<!-- Support for Mermaid -->
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({startOnLoad:true, theme:'default'});
    await mermaid.run({querySelector:'code.language-mermaid'});
</script>

<!-- Language switch placeholder - shows coming soon message -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const langToggle = document.getElementById('lang-toggle');
    
    if (langToggle) {
        const langToggleLink = langToggle.querySelector('a');
        if (langToggleLink) {
            langToggleLink.addEventListener('click', function(e) {
                e.preventDefault();
                alert('Language switching feature is under development');
            });
        }
    }
});
</script>

<!-- end custom footer snippets -->
