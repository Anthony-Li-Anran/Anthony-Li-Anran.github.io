{% if site.live2d.enabled and site.live2d.model != empty and page.live2d != false %}
<link rel="stylesheet" href="{{ '/assets/css/live2d.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<aside id="live2d-companion" lang="zh-CN" aria-label="星 · 网站伙伴"
 data-model="{{ site.live2d.model | relative_url | escape }}"
 data-knowledge="{{ '/assets/stelle-knowledge.json' | relative_url }}" data-context="{{ '/assets/stelle-context.json' | relative_url }}" data-page-title="{{ page.title | default: '首页' | escape }}"
 data-intro="{{ page.companion_intro | escape }}"
 data-runtime="{{ '/assets/live2d/runtime/' | relative_url }}" hidden>
 <div id="live2d-panel" hidden>
  <div id="stelle-intro" hidden><button type="button" id="stelle-intro-close" aria-label="关闭介绍">×</button><p id="live2d-message" role="status"></p></div>
  <section id="stelle-chat" aria-label="和星聊天" hidden>
   <header class="stelle-header"><span class="stelle-star" aria-hidden="true">✦</span><div><strong>星</strong><small id="stelle-status" role="status">在这里，陪你看看。</small></div><button id="stelle-settings-toggle" type="button" aria-label="连接与偏好设置" aria-expanded="false">⚙</button><button id="stelle-close" type="button" aria-label="收起聊天">−</button></header>
   <form id="stelle-settings" hidden>
    <div id="stelle-byok"><label>服务商<select id="stelle-provider"><option value="deepseek">DeepSeek</option><option value="qwen">千问（北京地域）</option></select></label><label>模型<input id="stelle-model" value="deepseek-v4-flash" maxlength="80" autocomplete="off"></label><label>你的 API Key<input id="stelle-key" type="password" autocomplete="off" maxlength="512" placeholder="仅在当前页面使用"></label><p class="stelle-note">浏览器直连所选服务商，费用由你的账户承担。密钥不保存，离开页面需重填；对话及相关公开资料会发给该服务商。</p></div>
    <label class="stelle-check"><input id="stelle-auto-intro" type="checkbox" checked>切换页面时介绍一下</label>
    <div class="stelle-settings-actions"><button type="submit">连接</button><button id="stelle-clear" type="button">清除会话与凭证</button></div>
   </form>
   <div id="stelle-messages" role="log" aria-label="对话记录" aria-live="polite" aria-relevant="additions"></div>
   <div id="stelle-suggestions"><button type="button" data-prompt="介绍一下这页">介绍这页</button><button type="button" data-prompt="Anthony最近在忙什么？">他的近况</button></div>
   <form id="stelle-compose"><label class="stelle-sr" for="stelle-input">想和星说什么？</label><textarea id="stelle-input" rows="1" maxlength="2000" placeholder="想聊什么？" enterkeyhint="send"></textarea><button id="stelle-send" type="submit" aria-label="发送消息">↑</button><button id="stelle-stop" type="button" hidden>停止</button></form>
   <p class="stelle-footnote">AI 的回答可能有误 · 关于 Anthony 的信息以公开资料为准</p>
  </section>
  <div id="live2d-portrait" aria-hidden="true"><canvas id="live2d-canvas" width="320" height="230"></canvas></div>
  <div class="live2d-actions"><button id="live2d-greet" type="button" aria-controls="stelle-chat" aria-expanded="false"><span aria-hidden="true">✦</span> 和星聊聊</button><button id="live2d-hide" type="button" aria-label="隐藏看板娘">×</button></div>
 </div>
 <button id="live2d-show" type="button" aria-controls="live2d-panel" aria-expanded="false" hidden>✦ 星</button>
</aside>
<script defer src="{{ '/assets/js/live2d.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<script defer src="{{ '/assets/js/stelle-direct.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<script defer src="{{ '/assets/js/stelle-chat.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
{% endif %}
